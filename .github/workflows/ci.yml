name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Android Docker image
        run: docker build -t patch-minder-builder .

      - name: Run unit tests in Docker
        run: |
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            patch-minder-builder \
            ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK in Docker
        run: |
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            patch-minder-builder \
            ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk patch-minder.apk

      - name: Generate release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "value=v$(date +%Y-%m-%d)-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: patch-minder.apk
